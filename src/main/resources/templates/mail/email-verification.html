<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>loop 이메일 인증</title>
</head>
<body style="margin:0;padding:0;background:#f4f8f6;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#172e2a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f8f6;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border:1px solid #e3ebe7;border-radius:24px;overflow:hidden;box-shadow:0 16px 48px rgba(23,46,42,0.10);">
          <tr>
            <td style="padding:28px 32px;background:#e7f9f2;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="38" height="38" align="center" valign="middle" style="width:38px;height:38px;border-radius:11px;background:#137f60;color:#ffffff;font-size:24px;font-weight:800;">l</td>
                  <td style="padding-left:10px;color:#172e2a;font-size:26px;font-weight:800;letter-spacing:-1px;">loop</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:36px 32px 12px;">
              <p style="margin:0 0 10px;color:#137f60;font-size:12px;font-weight:800;letter-spacing:1.4px;">EMAIL VERIFICATION</p>
              <h1 style="margin:0 0 14px;color:#172e2a;font-size:26px;line-height:1.35;letter-spacing:-1px;">이메일 인증을 완료해주세요</h1>
              <p style="margin:0;color:#6e7e79;font-size:15px;line-height:1.7;">loop 회원가입을 위한 인증번호입니다.<br>아래 번호를 인증 화면에 입력해주세요.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 32px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f8f6;border:1px solid #dce9e3;border-radius:18px;">
                <tr>
                  <td align="center" style="padding:28px 16px 12px;color:#6e7e79;font-size:12px;font-weight:700;">인증번호</td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 16px;color:#137f60;font-size:38px;font-weight:800;letter-spacing:10px;line-height:1.2;">{{CODE}}</td>
                </tr>
                <tr>
                  <td align="center" style="padding:14px 16px 26px;color:#ff755f;font-size:13px;font-weight:700;">{{TTL_MINUTES}}분 동안 유효합니다</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 36px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#fff8f5;border-radius:13px;">
                <tr>
                  <td style="padding:15px 17px;color:#7c6a63;font-size:12px;line-height:1.65;">
                    <strong style="color:#5f4c45;">보안 안내</strong><br>
                    본인이 요청하지 않았다면 이 메일을 무시해주세요. 인증번호는 누구에게도 공유하지 마세요.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 24px;background:#172e2a;color:#b8c7c2;font-size:11px;line-height:1.6;">
              가까운 이웃과 편안하게 연결되는 공간, loop<br>
              이 메일은 회원가입 인증 요청에 의해 자동 발송되었습니다.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
